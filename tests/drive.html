<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Driving Sabre Motion Lab</title>
  </head>
  <body>
    <!--
      tests/browser.test.js serves this page beside the site. It loads the site
      in a frame, works every control the way a person would, and writes what
      it saw into #results for the test to check.
    -->
    <iframe id="page" src="/" width="1280" height="900" title="Sabre Motion Lab"></iframe>
    <pre id="results"></pre>
    <script type="module">
      const results = { errors: [], seen: {} };
      const frame = document.getElementById("page");

      frame.addEventListener("load", async () => {
        const win = frame.contentWindow;
        win.addEventListener("error", (event) => results.errors.push(event.message));
        win.addEventListener("unhandledrejection", (event) => results.errors.push(String(event.reason)));
        try {
          // Opened as drive.html?fallback, in a browser that cannot draw in 3D, it only looks at what stands in.
          if (location.search === "?fallback") await driveFallback(win, frame.contentDocument, results.seen);
          else {
            drive(win, frame.contentDocument, results.seen);
            await drivePostures(win, frame.contentDocument, results.seen);
            driveHandles(win, frame.contentDocument, results.seen);
            await drive3d(win, frame.contentDocument, results.seen);
            await driveFigures(win, frame.contentDocument, results.seen);
          }
        } catch (error) {
          results.errors.push(`${error.name}: ${error.message}`);
        }
        document.getElementById("results").textContent = JSON.stringify(results);
      });

      // The book's photographs of its postures load, at the size the page says. Each posture's are asked for as it is
      // shown, and all are waited for together: the browser's virtual clock runs on while it waits, and the driver has
      // only so much of it.
      async function driveFigures(win, doc, seen) {
        const $$ = (selector) => [...doc.querySelectorAll(selector)];
        $$("button").find((b) => b.textContent.trim() === "Book knowledge").click();
        const asked = $$(".base-button").map((posture) => {
          posture.click();
          return $$("#base-figures img");
        });
        seen.figuresLoaded = await Promise.all(
          asked.map((images) =>
            Promise.all(images.map((image) => image.decode().then(() => image.naturalWidth === Number(image.getAttribute("width")) && image.naturalHeight === Number(image.getAttribute("height")), () => false))),
          ),
        );
      }

      // What the stage shows of the fencers: the 3D figures' canvas, the stick figures that stand in without them,
      // and the note that says why.
      function fencersShown(doc) {
        const $ = (selector) => doc.querySelector(selector);
        return {
          canvas: !$("#stage-3d").classList.contains("hidden"),
          sticks: ["#stick-a", "#stick-b"].map((id) => ($(id).getAttribute("d") ?? "") !== ""),
          note: $("#stage-note").classList.contains("hidden") ? "" : $("#stage-note").textContent,
        };
      }

      // Waits until the 3D figures are on the stage, or the note says why they are not.
      async function settled(win, doc) {
        for (let wait = 0; wait < 400; wait++) {
          const now = fencersShown(doc);
          if (now.canvas || now.note) return now;
          await new Promise((resolve) => win.setTimeout(resolve, 50));
        }
        return fencersShown(doc);
      }

      // The 3D figures load as the page opens and take the stage; in a browser that cannot draw them, stick figures
      // stand in, and a note under the stage says why.
      async function drive3d(win, doc, seen) {
        const $ = (selector) => doc.querySelector(selector);
        const $$ = (selector) => [...doc.querySelectorAll(selector)];
        const button = (name) => $$("button").find((b) => b.textContent.trim() === name || b.getAttribute("aria-label") === name);
        const input = (el, value) => {
          el.value = String(value);
          el.dispatchEvent(new win.Event("input", { bubbles: true }));
        };
        button("Practice library").click();
        $$(".scene-button")[0].click();
        // Nothing plays on its own, which matters here: a browser with no graphics card draws the figures in software,
        // and while a scene plays it would draw them frame after frame, however little of the page's time passes, for as
        // long as this waits. The figures are drawn when they are loaded, playing or not.
        seen.figures3d = { loaded: await settled(win, doc) };
        // Every step, a turned camera and the close-up draw them too; a pair is two figures.
        for (const step of $$(".step-button")) step.click();
        input($("#camera"), 30);
        button("Hand close-up").click();
        button("Hand close-up").click();
        input($("#camera"), 0);
        seen.figures3d.pair = $("#stage-3d").dataset.fencers ?? "";
        // The postures are one fencer alone, which is one figure.
        button("Base postures").click();
        seen.figures3d.solo = $("#stage-3d").dataset.fencers ?? "";
        button("Practice library").click();
      }

      async function driveFallback(win, doc, seen) {
        seen.fallback = await settled(win, doc);
        // The stick figures stand in the same frame as the 3D ones, so the stage is shown in a mirror here as well.
        seen.fallbackMirror = win.getComputedStyle(doc.querySelector(".stage__frame")).transform;
      }

      // The numbers of a posture, which the base postures let a person change. What they change is their own version of
      // the posture: kept on this device, and drawn wherever the page uses the posture.
      async function drivePostures(win, doc, seen) {
        const $ = (selector) => doc.querySelector(selector);
        const $$ = (selector) => [...doc.querySelectorAll(selector)];
        const button = (name) => $$("button").find((b) => b.textContent.trim() === name || b.getAttribute("aria-label") === name);
        const input = (el, value) => {
          el.value = String(value);
          el.dispatchEvent(new win.Event("input", { bubbles: true }));
        };
        const text = (selector) => $(selector).textContent;
        const visible = (el) => el.getClientRects().length > 0;
        const hidden = (selector) => $(selector).classList.contains("hidden");
        const tick = () => new Promise((resolve) => win.setTimeout(resolve, 0));
        const panelName = (el) => [...el.classList].find((name) => name.startsWith("panel--")).slice(7);

        // What the page keeps of them, and what another tab would do to it, which the page is told of the way a tab is.
        const KEY = "moulinet.postures";
        const kept = () => JSON.parse(win.localStorage.getItem(KEY) ?? "null");
        const keep = (store) => {
          win.localStorage.setItem(KEY, typeof store === "string" ? store : JSON.stringify(store));
          win.dispatchEvent(new win.StorageEvent("storage", { key: KEY }));
        };
        const asked = [];
        let answer = true;
        win.confirm = (message) => {
          asked.push(message);
          return answer;
        };

        // A slider of the numbers, and what its row says.
        const slider = (key) => $(`#posture-joint-${key}`);
        const row = (key) => slider(key).closest(".joint");
        const said = (key) => {
          const value = row(key).querySelector(".joint__value");
          const reset = row(key).querySelector(".joint__reset");
          return { value: value.textContent, moved: value.classList.contains("is-adjusted"), idle: reset.classList.contains("is-idle"), hint: reset.title, slider: slider(key).value };
        };
        // The posture buttons that say they are the person's own, by their place in the list.
        const marked = () => $$(".base-button").flatMap((b, i) => (b.querySelector(".base-button__mine").classList.contains("hidden") ? [] : [i]));
        const looks = () => ({
          open: visible($("#posture-panel")),
          button: text("#posture-edit"),
          expanded: $("#posture-edit").getAttribute("aria-expanded"),
          target: text("#base-name"),
          tag: !hidden("#base-version"),
          marked: marked(),
          status: visible($("#posture-panel")) ? text("#posture-status") : "",
        });
        const goTo = (index) => $$(".base-button")[index].click();
        const reset = (key) => row(key).querySelector(".joint__reset").click();

        win.localStorage.removeItem(KEY);
        seen.posture = {};
        const posture = seen.posture;

        // ---------- Opening the numbers ----------

        // They are closed at first, and the posture is as built in.
        button("Base postures").click();
        goTo(0);
        posture.closed = { ...looks(), stage: $("#main").classList.contains("is-editing-posture"), note: !hidden("#versions-note"), stored: kept() };

        // Pressing the button opens them, with the first slider ready, and pressing it again closes them.
        $("#posture-edit").focus();
        $("#posture-edit").click();
        posture.open = {
          ...looks(),
          panels: $$("main section.panel").filter(visible).map(panelName),
          title: text("#posture-target"),
          guardNote: !hidden("#posture-guard"),
          sliders: $$("#posture-joints input").map((el) => [el.id, el.min, el.max, el.step, el.value]),
          labels: $$("#posture-joints label").map((el) => [el.htmlFor, el.textContent]),
          resets: $$("#posture-joints .joint__reset").length,
          idle: $$("#posture-joints .joint__reset.is-idle").length,
          moved: $$("#posture-joints .is-adjusted").length,
          resetOff: $("#posture-reset").disabled,
          copyOff: $("#posture-copy").disabled,
          focus: doc.activeElement?.id,
          stage: $("#main").classList.contains("is-editing-posture"),
          pinned: win.getComputedStyle($("#stage-panel")).position,
          announced: text("#announcer"),
          boxOpen: $("#posture-details").open,
          numbers: $("#posture-numbers").value,
          sliderIds: $$("#posture-joints input").map((el) => el.id).filter((id) => !id.startsWith("posture-joint-")).length,
        };
        posture.guard = { hip: said("hipY"), arm: said("arm"), hand: said("hand") };
        $("#posture-edit").click();
        posture.closedAgain = { ...looks(), stage: $("#main").classList.contains("is-editing-posture"), focus: doc.activeElement?.id };
        $("#posture-edit").click();

        // ---------- Changing them ----------

        // Moving sliders makes a version of the posture, kept as they move and drawn on the stage: the marks on the floor
        // round the feet follow the front foot, which the 3D figures do not show in the page.
        const feet = $("#ground-a").getAttribute("d");
        input(slider("arm"), -70);
        input(slider("hipY"), 68);
        input(slider("footF"), 100);
        posture.moved = {
          ...looks(),
          arm: said("arm"),
          hipY: said("hipY"),
          footF: said("footF"),
          blade: said("blade"),
          kept: kept(),
          feetFollow: $("#ground-a").getAttribute("d") !== feet,
          resetOff: $("#posture-reset").disabled,
          copyOff: $("#posture-copy").disabled,
          moved: $$("#posture-joints .is-adjusted").length,
          visibleResets: $$("#posture-joints .joint__reset:not(.is-idle)").length,
          numbers: $("#posture-numbers").value,
          stage: $("#main").classList.contains("is-editing-posture"),
        };

        // Another posture, while they are open: the panel follows to it. One that takes its arm from the guard shows the
        // guard's, as changed, but has no version of its own, until it is given one.
        goTo(2);
        posture.advance = { ...looks(), title: text("#posture-target"), guardNote: !hidden("#posture-guard"), arm: said("arm"), footF: said("footF"), hipY: said("hipY"), resetOff: $("#posture-reset").disabled };
        input(slider("arm"), -10);
        posture.advanceOwn = { arm: said("arm"), kept: kept(), marked: marked() };
        reset("arm");
        posture.advanceBack = { arm: said("arm"), kept: kept(), marked: marked(), focus: doc.activeElement?.id };

        // Back on the guard, one joint is put back on its own, and keeps the focus on its slider.
        goTo(0);
        reset("arm");
        posture.armBack = { arm: said("arm"), kept: kept(), focus: doc.activeElement?.id, hipY: said("hipY") };
        // A slider moved back to where the posture has the joint is no longer a version.
        input(slider("hipY"), 77);
        posture.hipBack = { hipY: said("hipY"), kept: kept() };
        input(slider("hipY"), 66);

        // ---------- Used across the page ----------

        // The Creator has the posture as the person made it: its slider shows the foot, and says what it goes back to.
        button("Creator").click();
        posture.creator = {
          open: visible($("#posture-panel")),
          stage: $("#main").classList.contains("is-editing-posture"),
          foot: { value: $("#joint-footF").value, text: $("#joint-footF").closest(".joint").querySelector(".joint__value").textContent, adjusted: $("#joint-footF").closest(".joint").querySelector(".joint__value").classList.contains("is-adjusted"), hint: $("#joint-footF").closest(".joint").querySelector(".joint__reset").title },
          hip: $("#joint-hipY").closest(".joint").querySelector(".joint__value").textContent,
          note: !hidden("#versions-note") ? text("#versions-note") : "",
          noteInStage: !!$("#stage-panel #versions-note"),
        };
        button("Practice library").click();
        posture.library = { note: !hidden("#versions-note") ? text("#versions-note") : "", showing: $$("main section.panel").filter(visible).map(panelName) };
        $$(".scene-button")[0].click();
        posture.libraryScene = { title: text("#scene-title"), note: !hidden("#versions-note") };
        // With two postures made over, the note says so in the plural, and with none it goes.
        keep({ version: 1, postures: { guard: { footF: 100, hipY: 66 }, parry3: { blade: 100 } } });
        posture.libraryTwo = { note: text("#versions-note") };
        keep({ version: 1, postures: { guard: { footF: 100, hipY: 66 } } });
        button("Base postures").click();
        posture.back = { ...looks(), note: !hidden("#versions-note"), stage: $("#main").classList.contains("is-editing-posture") };

        // ---------- Going back to the built-in numbers ----------

        // All of a posture's changes at once ask first, and a "no" changes nothing.
        $("#posture-edit").click();
        posture.reopened = { ...looks(), moved: $$("#posture-joints .is-adjusted").length };
        $("#posture-reset").focus();
        answer = false;
        $("#posture-reset").click();
        posture.declined = { asked: asked.at(-1), kept: kept(), moved: $$("#posture-joints .is-adjusted").length };
        answer = true;
        $("#posture-reset").click();
        posture.reset = { ...looks(), kept: kept(), moved: $$("#posture-joints .is-adjusted").length, focus: doc.activeElement?.id, resetOff: $("#posture-reset").disabled, copyOff: $("#posture-copy").disabled, numbers: $("#posture-numbers").value, footF: said("footF"), asked: asked.length, feetBack: $("#ground-a").getAttribute("d") === feet };

        // ---------- Sending them on ----------

        // The numbers are copied for sending on, all the versions' at once. Where the browser will not copy, they are left
        // selected for the person to copy.
        input(slider("arm"), -30);
        goTo(8);
        input(slider("blade"), 100);
        const send = $("#posture-numbers").value;
        Object.defineProperty(win.navigator, "clipboard", { value: undefined, configurable: true });
        $("#posture-copy").click();
        await tick();
        posture.wontCopy = {
          status: text("#posture-status"),
          warns: $("#posture-status").classList.contains("phrase-status--warn"),
          boxOpen: $("#posture-details").open,
          selected: [$("#posture-numbers").selectionStart, $("#posture-numbers").selectionEnd, $("#posture-numbers").value.length],
          focus: doc.activeElement?.id,
          numbers: $("#posture-numbers").value,
        };
        const copied = [];
        Object.defineProperty(win.navigator, "clipboard", { value: { writeText: async (words) => void copied.push(words) }, configurable: true });
        $("#posture-copy").click();
        await tick();
        posture.copied = { copied, same: copied[0] === send, status: text("#posture-status"), warns: $("#posture-status").classList.contains("phrase-status--warn") };
        delete win.navigator.clipboard;

        // ---------- What goes wrong ----------

        // A browser that will not keep the version still shows it, and says so.
        const setItem = win.Storage.prototype.setItem;
        win.Storage.prototype.setItem = () => {
          throw new win.DOMException("full", "QuotaExceededError");
        };
        input(slider("yaw"), 40);
        posture.full = { status: text("#posture-status"), isError: $("#posture-status").classList.contains("phrase-status--error"), yaw: said("yaw"), kept: kept() };
        win.Storage.prototype.setItem = setItem;
        input(slider("yaw"), 41);
        posture.saveAgain = { status: text("#posture-status"), isError: $("#posture-status").classList.contains("phrase-status--error"), kept: kept() };

        // Versions made in another tab come here, and go when that tab takes them back.
        keep({ version: 1, postures: { parry5: { yaw: 50 } } });
        posture.elsewhere = { marked: marked(), tag: !hidden("#base-version"), kept: kept() };
        goTo(11);
        posture.elsewhereParry5 = { marked: marked(), tag: !hidden("#base-version"), yaw: said("yaw") };
        keep({ version: 1, postures: {} });
        posture.elsewhereGone = { marked: marked(), tag: !hidden("#base-version"), yaw: said("yaw") };

        // Versions saved by a newer page are not shown and not written over.
        const future = JSON.stringify({ version: 2, postures: { parry5: { yaw: 50 } } });
        keep(future);
        input(slider("yaw"), 20);
        posture.newer = { marked: marked(), tag: !hidden("#base-version"), yaw: said("yaw"), status: text("#posture-status"), isError: $("#posture-status").classList.contains("phrase-status--error"), untouched: win.localStorage.getItem(KEY) === future };

        // ---------- Leaving ----------

        // The numbers close when the postures are left, and the Done button closes them and keeps the focus where it was.
        button("Creator").click();
        button("Base postures").click();
        posture.leftOpen = { open: visible($("#posture-panel")), button: text("#posture-edit"), stage: $("#main").classList.contains("is-editing-posture") };
        $("#posture-edit").click();
        button("Book knowledge").click();
        goTo(2);
        posture.bookClosed = { open: visible($("#posture-panel")), button: text("#posture-edit"), stage: $("#main").classList.contains("is-editing-posture") };
        // The book's postures can be edited too, with the same sliders.
        $("#posture-edit").click();
        posture.book = { open: visible($("#posture-panel")), target: text("#posture-target"), sliders: $$("#posture-joints input").length, guardNote: !hidden("#posture-guard"), stage: $("#main").classList.contains("is-editing-posture") };
        $("#posture-done").focus();
        $("#posture-done").click();
        posture.done = { open: visible($("#posture-panel")), button: text("#posture-edit"), expanded: $("#posture-edit").getAttribute("aria-expanded"), stage: $("#main").classList.contains("is-editing-posture"), focus: doc.activeElement?.id };
        button("Live knowledge").click();

        // Nothing is left of it on the device.
        win.localStorage.removeItem(KEY);
        win.dispatchEvent(new win.StorageEvent("storage", { key: KEY }));
        posture.cleaned = { stored: kept(), marked: marked(), note: !hidden("#versions-note") };
        button("Practice library").click();
      }

      // The dots the Creator puts on the parts of the fencers, which are taken hold of and dragged with the pointer instead
      // of moving sliders. The pointer is a mouse here: its events are made and sent the way the browser sends them.
      function driveHandles(win, doc, seen) {
        const $ = (selector) => doc.querySelector(selector);
        const $$ = (selector) => [...doc.querySelectorAll(selector)];
        const button = (name) => $$("button").find((b) => b.textContent.trim() === name || b.getAttribute("aria-label") === name);
        const input = (el, value) => {
          el.value = String(value);
          el.dispatchEvent(new win.Event("input", { bubbles: true }));
        };
        const text = (selector) => $(selector).textContent;
        const visible = (el) => el.getClientRects().length > 0;
        const pressed = (b) => b.getAttribute("aria-pressed") === "true";
        win.confirm = () => true;
        seen.handles = {};
        const handles = seen.handles;

        // The dots as the page has them: where each is across and down the stage's box, on the page as the mirror shows it,
        // and the phrase and the stage's view and camera they are placed by.
        const frame = $("#stage-frame");
        const looks = () => {
          const box = frame.getBoundingClientRect();
          return {
            view: $("#stage").getAttribute("viewBox"),
            box: [box.width, box.height],
            camera: Number($("#camera").value),
            phrase: $("#phrase-text").value,
            step: Number(text("#step-count").split("/")[0]) - 1,
            editing: text("#edit-title"),
            shown: visible($("#handles")),
            dots: $$(".handle").map((dot) => {
              const r = dot.getBoundingClientRect();
              return { title: dot.title, shown: visible(dot), other: dot.classList.contains("is-other"), dragging: dot.classList.contains("is-dragging"), across: (r.left + r.width / 2 - box.left) / box.width, down: (r.top + r.height / 2 - box.top) / box.height, size: [r.width, r.height] };
            }),
          };
        };
        const sliders = (...keys) => Object.fromEntries(keys.map((key) => [key, $(`#joint-${key}`).value]));

        // A pointer, a mouse until it is said to be a finger: it goes down on a dot, moves, and comes up, the moves and the
        // release reaching the window.
        const mouse = { id: 7, type: "mouse" };
        const fire = (target, type, [x, y], more = {}) =>
          target.dispatchEvent(new win.PointerEvent(type, { bubbles: true, cancelable: true, pointerId: mouse.id, pointerType: mouse.type, isPrimary: true, button: 0, buttons: type === "pointerup" ? 0 : 1, clientX: x, clientY: y, ...more }));
        const dot = (title) => $$(".handle").find((d) => d.title === title);
        const middle = (el) => {
          const r = el.getBoundingClientRect();
          return [r.left + r.width / 2, r.top + r.height / 2];
        };
        // Takes hold of a dot, moves it by `by` on the page in a few steps and lets go. Returns whether the pointer was kept
        // from the page's own handling, and whether the dot was held while it moved.
        const dragDot = (title, by, steps = 6) => {
          const el = dot(title);
          const [x, y] = middle(el);
          const down = fire(el, "pointerdown", [x, y]);
          const held = el.classList.contains("is-dragging");
          for (let i = 1; i <= steps; i++) fire(win, "pointermove", [x + (by[0] * i) / steps, y + (by[1] * i) / steps]);
          const stillHeld = el.classList.contains("is-dragging");
          fire(win, "pointerup", [x + by[0], y + by[1]]);
          return { defaultPrevented: !down, held, stillHeld, letGo: !el.classList.contains("is-dragging") };
        };

        // ---------- The dots ----------

        // They are the Creator's, and only there: not in the library or the postures, whose toggle is not shown either.
        button("Practice library").click();
        handles.library = { dots: visible($("#handles")), toggle: visible($("[data-toggle=handles]")) };
        button("Base postures").click();
        handles.base = { dots: visible($("#handles")), toggle: visible($("[data-toggle=handles]")) };
        button("Creator").click();
        button("New scene").click();
        handles.opening = { ...looks(), toggle: { shown: visible($("[data-toggle=handles]")), pressed: pressed($("[data-toggle=handles]")), label: text("[data-toggle=handles]").trim() } };

        // ---------- Taking hold ----------

        // Taking hold of A's sword hand and moving it up the page takes the arm with it, and the hand stays under the pointer.
        handles.hand = { ...dragDot("Drag to move A's sword hand", [0, -30]), after: looks(), sliders: sliders("arm", "fore", "blade", "x") };
        // B's, with A being edited: the fencer taken hold of becomes the one being edited, and the other is left as it was.
        handles.other = { before: looks().editing, pressedA: pressed($("#fencer-a")), ...dragDot("Drag to move B's sword hand", [0, -24]), after: looks(), pressedB: pressed($("#fencer-b")), sliders: sliders("arm", "fore") };
        // A back foot taken to the right on the page goes along the piste, which is toward B for A.
        $("#fencer-a").click();
        handles.foot = { ...dragDot("Drag to move A's back foot", [40, 0]), after: looks(), sliders: sliders("x", "footF", "hipX") };
        // The head, which turns the body: taken across and brought back to where it was, the lean is no adjustment.
        handles.lean = { out: (dragDot("Drag to move A's head", [30, 0]), sliders("lean")), back: (dragDot("Drag to move A's head", [-30, 0]), sliders("lean")), after: looks() };
        // The hips take the body up and down and along.
        handles.hips = { ...dragDot("Drag to move A's hips", [-24, -16]), sliders: sliders("hipX", "hipY"), after: looks() };

        // ---------- From other sides ----------

        // The camera turns, and the dots go with the parts, which they are taken by from there.
        input($("#camera"), 60);
        handles.turned = { ...looks(), sliders: sliders("footF") };
        handles.turnedDrag = { ...dragDot("Drag to move A's front foot", [-30, -10]), after: looks(), sliders: sliders("footF", "liftF") };
        input($("#camera"), -180);
        handles.round = looks();
        input($("#camera"), 0);

        // ---------- What is not a drag ----------

        // A button other than the first, and a mouse button that was let go where the page could not see, move nothing.
        const before = $("#phrase-text").value;
        const hand = dot("Drag to move A's sword hand");
        const [hx, hy] = middle(hand);
        const aside = fire(hand, "pointerdown", [hx, hy], { button: 2, buttons: 2 });
        fire(win, "pointermove", [hx, hy - 30]);
        fire(win, "pointerup", [hx, hy - 30], { button: 2 });
        handles.otherButton = { moved: $("#phrase-text").value !== before, held: hand.classList.contains("is-dragging") };
        fire(hand, "pointerdown", [hx, hy]);
        fire(win, "pointermove", [hx, hy - 10]);

        fire(hand, "pointerdown", [hx, hy]);
        const before3 = $("#phrase-text").value;
        mouse.id = 8;
        fire(win, "pointermove", [hx, hy - 50]);
        fire(win, "pointerup", [hx, hy - 50]);

        handles.strangerPointer = { moved: $("#phrase-text").value !== before3, stillHeld: hand.classList.contains("is-dragging") };
        fire(win, "pointerup", [hx, hy]);
        handles.finished = { held: hand.classList.contains("is-dragging") };
        // The same pointer pressing again says the drag before never saw it lifted: the new one takes hold where it is, and
        // the part does not jump to the pointer, which is 6 px off its middle.
        const foot = dot("Drag to move A's front foot");
        const [fx, fy] = middle(foot);
        fire(foot, "pointerdown", [fx, fy]);
        fire(win, "pointermove", [fx - 20, fy]);
        const [gx, gy] = middle(foot);
        fire(foot, "pointerdown", [gx + 6, gy]);
        const phraseAtPress = $("#phrase-text").value;
        fire(win, "pointermove", [gx + 6, gy]);
        handles.pressedAgain = { moved: $("#phrase-text").value !== phraseAtPress, held: foot.classList.contains("is-dragging") };
        fire(win, "pointerup", [gx + 6, gy]);
        handles.pressedAgainEnded = { held: foot.classList.contains("is-dragging") };

        mouse.type = "touch";
        const touchBefore = looks();
        handles.touch = { ...dragDot("Drag to move A's sword elbow", [0, -12]), before: touchBefore, after: looks() };
        mouse.type = "mouse";

        // Taken far off the stage, a part goes as far as its sliders allow and nothing is broken.
        dragDot("Drag to move A's hips", [-4000, -4000], 3);
        const broken = () => $$("#stage path").filter((path) => /NaN|Infinity|undefined/.test(path.getAttribute("d") ?? "")).length;
        handles.farOff = { sliders: sliders("hipX", "hipY"), phrase: /NaN|null|Infinity/.test($("#phrase-text").value), paths: broken() };

        button("Pause").click();
        handles.paused = { shown: visible($("#handles")) };
        // So does moving along the timeline, until a step is picked.

        $$(".step-button")[0].click();
        handles.stepPicked = { shown: visible($("#handles")) };
        // The close-up of the hand looks at one place only.
        button("Hand close-up").click();
        handles.closeUp = { shown: visible($("#handles")) };
        button("Hand close-up").click();
        // The toggle puts them away and brings them back.
        button("Drag dots").click();
        handles.off = { shown: visible($("#handles")), pressed: pressed($("[data-toggle=handles]")) };
        button("Drag dots").click();
        handles.on = { shown: visible($("#handles")), pressed: pressed($("[data-toggle=handles]")) };

        $$(".step-button")[0].click();
        handles.resumed = { shown: visible($("#handles")) };
        // One fencer alone has no dots on the other.
        $("#meta-solo").click();
        handles.solo = { A: $$(".handle").filter((d) => d.title.startsWith("Drag to move A") && visible(d)).length, B: $$(".handle").filter((d) => d.title.startsWith("Drag to move B") && visible(d)).length };
        $("#meta-solo").click();
        handles.pair = { B: $$(".handle").filter((d) => d.title.startsWith("Drag to move B") && visible(d)).length };
        // Leaving the Creator takes them away.
        button("Base postures").click();
        handles.left = { shown: visible($("#handles")) };
        button("Creator").click();
        handles.back = { shown: visible($("#handles")) };

        // The scene's own words go into the data, in their place, and back.
        input($("#meta-note"), "Arm first.");
        input($("#meta-reference"), "https://example.com/watch?v=abc");
        input($("#meta-event"), "Club night, October");
        input($("#meta-name"), "Lunge to the head");
        seen.words = { head: lines().slice(0, 7), status: text("#save-status") };
        input($("#meta-name"), "   ");
        seen.nameBlanked = { line: lines()[1], field: $("#meta-name").value };
        input($("#meta-name"), "Lunge to the head");

        // What cannot be saved says why, and saves nothing.
        input($("#meta-name"), "");
        $("#scene-save").click();
        seen.noName = { status: text("#save-status"), isError: $("#save-status").classList.contains("phrase-status--error"), focus: doc.activeElement?.id, saved: savedScenes().length };
        input($("#meta-name"), "Lunge to the head");
        input($("#meta-reference"), "javascript:alert(1)");
        seen.badLink = { hint: text("#reference-hint"), hintIsError: $("#reference-hint").classList.contains("field__hint--error") };
        $("#scene-save").click();
        seen.badLinkSave = { status: text("#save-status"), focus: doc.activeElement?.id, saved: savedScenes().length };
        input($("#meta-reference"), "https://example.com/watch?v=abc");
        seen.goodLink = { hint: text("#reference-hint") };
        input(phraseText, '{"steps": [');
        $("#scene-save").click();
        seen.brokenSave = { status: text("#save-status"), saved: savedScenes().length };
        input(phraseText, `{"name": "Lunge to the head", "event": "Club night, October", "reference": "https://example.com/watch?v=abc", "note": "Arm first.", "steps": [{"label": "En garde", "A": {"pose": "guard", "x": 0}, "B": {"pose": "guard", "x": 245}}]}`);

        // The steps: add one, name it, time it, pose it; the first has no move time.
        seen.firstStep = {
          moveOff: $("#step-ms").disabled,
          hint: text("#step-hint"),
          removeOff: $("#step-remove").disabled,
          placeholder: $("#step-name").getAttribute("placeholder"),
          label: $("#step-name").value,
          hold: $("#step-hold").value,
        };
        $("#step-add").click();
        seen.added = {
          count: text("#step-count"),
          line: stepLine(1),
          label: $("#step-name").value,
          placeholder: $("#step-name").getAttribute("placeholder"),
          moveOff: $("#step-ms").disabled,
          move: $("#step-ms").value,
          hold: $("#step-hold").value,
          hint: text("#step-hint"),
          removeOff: $("#step-remove").disabled,
          paused: $("#play-button").getAttribute("aria-label"),
        };
        input($("#step-name"), "Lunge");
        input($("#step-ms"), "150");
        input($("#step-hold"), "400");
        choose($("#step-ease"), "snap");
        $$(".pose-button").find((b) => b.textContent.endsWith("lungeHead")).click();
        seen.timed = { line: stepLine(1), button: $$(".step-button")[1].textContent, ease: $("#step-ease").value, status: text("#phrase-status") };
        input($("#step-ms"), "-20");
        seen.negative = { field: $("#step-ms").value, line: stepLine(1) };
        input($("#step-hold"), "");
        input($("#step-ms"), "");
        choose($("#step-ease"), "");
        input($("#step-name"), "");
        seen.cleared = { line: stepLine(1), label: $("#step-name").value, button: $$(".step-button")[1].textContent };
        input($("#step-name"), "Lunge");
        $$(".step-button")[0].click();
        $("#step-add").click();
        input($("#step-name"), "Between");
        seen.between = { labels: $$(".step-button").map((b) => b.textContent), count: text("#step-count") };
        // With no time to stay on it, a step is passed through, and says so; but not while the step after it has no
        // move time to run on into.
        input($("#step-hold"), "");
        seen.noHold = { hint: text("#step-hint") };
        $$(".step-button")[2].click();
        input($("#step-ms"), "150");
        $$(".step-button")[1].click();
        seen.passedThrough = { hint: text("#step-hint"), line: stepLine(1) };
        $("#step-remove").click();
        seen.removed = { labels: $$(".step-button").map((b) => b.textContent), count: text("#step-count"), editing: text("#edit-title") };
        // One fencer only, and two again.
        $("#meta-solo").click();
        seen.alone = { line: lines()[5], solo: $("#stage-panel").classList.contains("is-solo"), stickB: display("#stick-b"), canEditB: !$("#fencer-b").disabled };
        $("#meta-solo").click();
        seen.together = { line: lines().some((line) => line.includes('"solo"')), solo: $("#stage-panel").classList.contains("is-solo"), stickB: display("#stick-b") };
        checkPaths();

        // The data is the scene: typing into it fills in the fields.
        input(phraseText, '{"name": "From the data", "note": "Typed here", "steps": [{"label": "Only"}]}');
        seen.typed = { name: $("#meta-name").value, event: $("#meta-event").value, note: $("#meta-note").value };
        input(phraseText, `{"name": "Lunge to the head", "event": "Club night, October", "reference": "https://example.com/watch?v=abc", "note": "Arm first.", "steps": [{"label": "En garde", "hold": 600, "A": {"pose": "guard", "x": 0}, "B": {"pose": "guard", "x": 245}}, {"label": "Lunge", "ms": 150, "A": {"pose": "lungeHead", "x": 0}}]}`);

        // Saving: it is kept, with the camera it is seen from, and the button says what it does next.
        input($("#camera"), 33);
        $("#scene-save").click();
        const [first] = savedScenes();
        seen.saved = {
          status: text("#save-status"),
          save: text("#scene-save"),
          copyHidden: hidden("#scene-save-copy"),
          count: savedScenes().length,
          phrase: first.phrase,
          text: lines().slice(0, 7),
        };
        input($("#meta-note"), "Arm first, then legs.");
        seen.editedAfter = { status: text("#save-status") };
        button("Save as a new copy").click();
        seen.copy = { count: savedScenes().length, names: savedScenes().map((scene) => scene.phrase.name), notes: savedScenes().map((scene) => scene.phrase.note), ids: new Set(savedScenes().map((scene) => scene.id)).size };
        $("#scene-save").click();
        seen.again = { count: savedScenes().length };

        // The browser says no.
        const setItem = win.Storage.prototype.setItem;
        win.Storage.prototype.setItem = () => {
          throw new win.DOMException("full", "QuotaExceededError");
        };
        $("#scene-save").click();
        seen.full = { status: text("#save-status"), isError: $("#save-status").classList.contains("phrase-status--error"), count: savedScenes().length };
        win.Storage.prototype.setItem = setItem;

        // Switching modes keeps what the Creator had.
        input($("#meta-event"), "Kept while away");
        $$(".step-button")[1].click();
        button("Base postures").click();
        button("Creator").click();
        seen.kept = { event: $("#meta-event").value, count: text("#step-count"), showing: showing().panels };

        // ---------- The library again, with scenes saved ----------

        button("Practice library").click();
        seen.listed = {
          saved: $$("#scenes-saved .scene-button").map((card) => card.textContent),
          builtIn: $$("#scenes-builtin .scene-button").length,
          emptyHidden: hidden("#scenes-empty"),
          pressed: $$(".scene-button[aria-pressed=true]").length,
        };
        const savedCards = $$("#scenes-saved .scene-button");
        savedCards[0].click();
        const link = $("#scene-reference a");
        seen.savedDetail = {
          title: text("#scene-title"),
          kind: text("#scene-kind"),
          event: text("#scene-event"),
          eventNone: $("#scene-event").classList.contains("is-empty"),
          note: text("#scene-note"),
          linkText: link?.firstChild.textContent,
          href: link?.getAttribute("href"),
          target: link?.getAttribute("target"),
          rel: link?.getAttribute("rel"),
          said: link?.querySelector(".visually-hidden")?.textContent,
          edit: text("#scene-edit"),
          deleteHidden: hidden("#scene-delete"),
          count: text("#step-count"),
          camera: $("#camera").value,
          saved: $$(".scene-button").indexOf(savedCards[0]),
        };

        // What is stored is not to be trusted: a link that is a script, and words that are markup.
        keepScenes([
          ...savedScenes(),
          { id: "evil", phrase: { name: "<b>Evil</b>", event: "<img src=x onerror=alert(1)>", reference: "javascript:alert(1)", note: "<i>x</i>", steps: [{ label: "<u>Step</u>" }] } },
          { id: "broken", phrase: { name: "No steps", steps: [] } },
        ]);
        const evil = $$("#scenes-saved .scene-button").find((card) => card.textContent.includes("Evil"));
        evil.click();
        seen.hostile = {
          cards: $$("#scenes-saved .scene-button").length,
          title: text("#scene-title"),
          links: $$("#scene-reference a").length,
          reference: text("#scene-reference"),
          referenceNone: $("#scene-reference").classList.contains("is-empty"),
          event: text("#scene-event"),
          markup: $$("#scenes-saved b, #scenes-saved img, #scene-note i, #scene-title b, #steps u, #scene-event img").length,
        };
        checkPaths();

        // Editing a scene that was saved: the same scene is saved over, and a scene with changes asks first.
        // (The Creator still has the change typed while away, so this first one asks.)
        savedCards[0].click();
        const before = asked.length;
        button("Edit in the Creator").click();
        seen.editSaved = {
          asked: asked.length - before,
          name: $("#meta-name").value,
          save: text("#scene-save"),
          copyHidden: hidden("#scene-save-copy"),
          showing: showing().chosen,
        };
        input($("#meta-note"), "Changed in the Creator");
        button("Practice library").click();
        $$("#scenes-saved .scene-button")[1].click();
        answer = false;
        button("Edit in the Creator").click();
        seen.declined = { asked: asked.length - before, mode: showing().chosen, note: $("#meta-note").value, title: text("#scene-title") };
        answer = true;
        button("Edit in the Creator").click();
        seen.accepted = { asked: asked.length - before, mode: showing().chosen, name: $("#meta-name").value, note: $("#meta-note").value };
        $("#scene-save").click();
        seen.overwrote = { count: savedScenes().length, status: text("#save-status") };
        // Leaving the page asks only while something is unsaved.
        const leaving = () => {
          const event = new win.Event("beforeunload", { cancelable: true });
          win.dispatchEvent(event);
          return event.defaultPrevented;
        };
        const savedLeaving = leaving();
        input($("#meta-note"), "Not saved yet");
        const unsavedLeaving = leaving();
        input($("#meta-note"), "Arm first.");
        seen.leaving = { saved: savedLeaving, unsaved: unsavedLeaving, backToSaved: leaving() };
        // Saved, so nothing is unsaved, and the next scene opens without asking.
        button("Practice library").click();
        $$("#scenes-saved .scene-button")[0].click();
        const clean = asked.length;
        button("Edit in the Creator").click();
        seen.cleanEdit = { asked: asked.length - clean, mode: showing().chosen };

        // Deleting asks first, and the page goes back to the first scene.
        button("Practice library").click();
        const target = $$("#scenes-saved .scene-button").find((card) => card.textContent.includes("Evil"));
        target.click();
        answer = false;
        button("Delete scene").click();
        seen.deleteDeclined = { cards: $$("#scenes-saved .scene-button").length, asked: asked.at(-1) };
        answer = true;
        $("#scene-delete").focus();
        $("#scene-delete").click();
        seen.deleted = {
          cards: $$("#scenes-saved .scene-button").length,
          stored: savedScenes().length,
          title: text("#scene-title"),
          focus: doc.activeElement?.dataset.mode ?? doc.activeElement?.dataset.tab,
        };
        for (const card of [...$$("#scenes-saved .scene-button")]) {
          card.click();
          button("Delete scene").click();
        }
        seen.allDeleted = { cards: $$("#scenes-saved .scene-button").length, stored: savedScenes().length, emptyShown: !hidden("#scenes-empty"), builtIn: $$("#scenes-builtin .scene-button").length };

        // The page and its other tabs agree: a scene deleted elsewhere leaves this one's list.
        keepScenes([{ id: "elsewhere", phrase: { name: "Saved in another tab", steps: [{ label: "x" }] } }]);
        $$("#scenes-saved .scene-button")[0].click();
        keepScenes([]);
        seen.elsewhere = { cards: $$("#scenes-saved .scene-button").length, title: text("#scene-title") };

        // What the Creator was asked, so far; the scenes below ask their own questions.
        seen.asked = [...asked];
        checkPaths();

        // ---------- Text that is not a phrase yet ----------

        // A pasted phrase with a mistake in it keeps the fields still, so a change
        // to one cannot put the last good phrase over what was typed.
        button("Creator").click();
        answer = true;
        button("New scene").click();
        const editorSelector = "#meta-name, #meta-source, #meta-event, #meta-reference, #meta-note, #meta-solo, #step-name, #step-ms, #step-hold, #step-ease, #step-add, #step-remove, #reset-step, #joints input, #joints button, .pose-button";
        const editors = () => ({ total: $$(editorSelector).length, off: $$(editorSelector).filter((el) => el.disabled).map((el) => el.id || el.textContent.slice(0, 12)).length });
        input($("#meta-name"), "Kept name");
        seen.fieldsOn = editors();
        $("#meta-name").focus();
        input(phraseText, '{"name": "Mine", "steps": [');
        seen.onHold = {
          ...editors(),
          status: text("#phrase-status"),
          note: text("#save-status"),
          noteIsWarning: $("#save-status").classList.contains("phrase-status--warn"),
          // The control that had the focus handed it to the text, which is where the typing is.
          focus: doc.activeElement?.id,
        };
        // A change that reaches the page anyway is dropped, and the text stays as typed.
        const stepsBefore = text("#step-count");
        input($("#meta-name"), "Typed while on hold");
        input($("#joint-blade"), 100);
        input($("#step-hold"), "999");
        $("#step-add").click();
        $$(".pose-button")[1].click();
        seen.keptOnHold = { text: phraseText.value, name: $("#meta-name").value, count: text("#step-count"), same: text("#step-count") === stepsBefore, status: text("#phrase-status") };
        // Saving says why it cannot, and stepping through the scene still works.
        $("#scene-save").click();
        seen.holdSave = { status: text("#save-status"), saved: savedScenes().length };
        // Once the text is a phrase the fields are on again, showing it.
        input(phraseText, '{"name": "Mine", "steps": [{"label": "A"}, {"label": "B"}]}');
        $$(".step-button")[1].click();
        seen.resumed = { ...editors(), status: text("#phrase-status"), note: text("#save-status"), name: $("#meta-name").value, steps: $$(".step-button").length };
        input($("#meta-name"), "Mine, renamed");
        seen.resumedEdit = { name: lines()[1], text: lines().slice(0, 3) };

        // ---------- Text longer than a field allows ----------

        const saveAndSay = (phrase) => {
          input(phraseText, JSON.stringify(phrase));
          const before = savedScenes().length;
          $("#scene-save").click();
          return { status: text("#save-status"), isError: $("#save-status").classList.contains("phrase-status--error"), focus: doc.activeElement?.id, added: savedScenes().length - before };
        };
        seen.longName = saveAndSay({ name: "x".repeat(101), steps: [{ label: "A" }] });
        seen.longSource = saveAndSay({ name: "ok", source: "s".repeat(41), steps: [{ label: "A" }] });
        seen.longEvent = saveAndSay({ name: "ok", event: "e".repeat(161), steps: [{ label: "A" }] });
        seen.longNote = saveAndSay({ name: "ok", note: "n".repeat(1001), steps: [{ label: "A" }] });
        seen.longLink = saveAndSay({ name: "ok", reference: `https://example.com/${"a".repeat(1990)}`, steps: [{ label: "A" }] });
        seen.longLabel = saveAndSay({ name: "ok", steps: [{ label: "A" }, { label: "L".repeat(101) }] });
        seen.longest = saveAndSay({ name: "n".repeat(100), source: "s".repeat(40), event: "e".repeat(160), note: "t".repeat(1000), steps: [{ label: "l".repeat(100) }] });

        // A scene saved elsewhere with far more than that is shown cut short, so it cannot slow the page.
        const huge = "W".repeat(30000);
        keepScenes([...savedScenes(), { id: "huge", phrase: { name: huge, source: huge, event: huge, note: huge, steps: [{ label: huge, hold: 500 }, { label: "Two", ms: 100, hold: 500 }] } }]);
        button("Practice library").click();
        const hugeCard = $$("#scenes-saved .scene-button").find((card) => card.textContent.includes("WWWW"));
        hugeCard.click();
        seen.huge = {
          card: hugeCard.querySelector(".scene-button__title").textContent.length,
          cardSource: hugeCard.querySelector(".scene-button__source").textContent.length,
          cardEvent: hugeCard.querySelector(".scene-button__event").textContent.length,
          title: text("#scene-title").length,
          titleEnd: text("#scene-title").slice(-1),
          source: text("#scene-source").length,
          event: text("#scene-event").length,
          note: text("#scene-note").length,
          stage: text("#step-label").length,
          stepButton: $$(".step-button")[0].textContent.length,
          other: $$(".step-button")[1].textContent,
        };
        keepScenes([]);

        // ---------- Scenes saved by a newer page ----------

        win.localStorage.setItem(STORE, JSON.stringify({ version: 2, scenes: [{ id: "x", phrase: { name: "From the future", steps: [{ label: "x" }] } }] }));
        const future = win.localStorage.getItem(STORE);
        win.dispatchEvent(new win.StorageEvent("storage", { key: STORE }));
        const futureCards = $$("#scenes-saved .scene-button").length;
        button("Creator").click();
        input(phraseText, JSON.stringify({ name: "Mine", steps: [{ label: "A" }] }));
        $("#scene-save").click();
        seen.newer = {
          cards: futureCards,
          status: text("#save-status"),
          isError: $("#save-status").classList.contains("phrase-status--error"),
          untouched: win.localStorage.getItem(STORE) === future,
        };
        keepScenes([]);

        // ---------- The same scene in two tabs ----------

        // Saving over a scene another tab changed would lose their work, so it is kept beside theirs.
        saveAndSay({ name: "Shared", note: "v1", steps: [{ label: "A" }] });
        keepScenes(savedScenes().map((scene) => ({ ...scene, phrase: { ...scene.phrase, note: "v2" } })));
        input($("#meta-name"), "Shared, renamed");
        $("#scene-save").click();
        seen.conflict = {
          status: text("#save-status"),
          names: savedScenes().map((scene) => scene.phrase.name),
          notes: savedScenes().map((scene) => scene.phrase.note),
          save: text("#scene-save"),
        };
        input($("#meta-note"), "v3");
        $("#scene-save").click();
        seen.afterConflict = { notes: savedScenes().map((scene) => scene.phrase.note), status: text("#save-status") };

        // One deleted in another tab is a new scene from here on, and saving says so.
        keepScenes([]);
        seen.deletedElsewhere = {
          save: text("#scene-save"),
          copyHidden: hidden("#scene-save-copy"),
          status: text("#save-status"),
        };
        $("#scene-save").click();
        seen.deletedThenSaved = { count: savedScenes().length, status: text("#save-status"), save: text("#scene-save") };
        // Deleted behind this tab's back, without a word, saving still does not bring it back under its old id.
        const [stale] = savedScenes();
        win.localStorage.setItem(STORE, JSON.stringify({ version: 1, scenes: [] }));
        input($("#meta-note"), "v4");
        $("#scene-save").click();
        seen.deletedUnseen = { count: savedScenes().length, status: text("#save-status"), idChanged: savedScenes()[0].id !== stale.id };
        keepScenes([]);

        // A scene on stage that another tab changed is loaded again; one it did not change stays on its step.
        const two = [{ label: "One", hold: 300 }, { label: "Two", ms: 100, hold: 300 }];
        keepScenes([{ id: "live", phrase: { name: "Live", steps: two } }]);
        button("Practice library").click();
        $$("#scenes-saved .scene-button")[0].click();
        $$(".step-button")[1].click();
        keepScenes([{ id: "live", phrase: { name: "Live", steps: two } }, { id: "other", phrase: { name: "Other", steps: [{ label: "x" }] } }]);
        seen.unchangedElsewhere = { count: text("#step-count"), cards: $$("#scenes-saved .scene-button").length };
        keepScenes([{ id: "live", phrase: { name: "Live, changed", steps: [...two, { label: "Three", ms: 100, hold: 300 }] } }]);
        seen.changedElsewhere = { count: text("#step-count"), title: text("#scene-title"), steps: $$(".step-button").length, label: text("#step-label") };
        keepScenes([]);

        // ---------- The camera is part of a saved scene ----------

        keepScenes([{ id: "cam", phrase: { name: "Camera", camera: 33, steps: [{ label: "x" }] } }]);
        $$("#scenes-saved .scene-button")[0].click();
        answer = true;
        button("Edit in the Creator").click();
        const opened = leaving();
        input($("#camera"), -20);
        const turned = leaving();
        const askedBefore = asked.length;
        answer = false;
        button("New scene").click();
        const declined = { asked: asked.length - askedBefore, name: $("#meta-name").value };
        answer = true;
        input($("#camera"), 33);
        seen.cameraUnsaved = { opened, turned, declined, backAgain: leaving() };
        // Moving it and saving makes the new angle the one that is kept.
        input($("#camera"), 10);
        $("#scene-save").click();
        seen.cameraSaved = { camera: savedScenes()[0].phrase.camera, unsaved: leaving() };
        keepScenes([]);

        // ---------- Taking out steps ----------

        button("New scene").click();
        input(phraseText, JSON.stringify({ name: "Two steps", steps: [{ label: "A" }, { label: "B" }] }));
        $$(".step-button")[1].click();
        $("#step-remove").focus();
        $("#step-remove").click();
        seen.removeFocus = { count: text("#step-count"), removeOff: $("#step-remove").disabled, focus: doc.activeElement?.id };
        checkPaths();
        seen.badPaths = badPaths;
      }
    </script>
  </body>
</html>
